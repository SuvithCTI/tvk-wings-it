services:
  # ─── Backend API (Node.js / Express) ───────────────────────────────────────
  - type: web
    name: tvk-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render assigns this automatically; keep fallback here
      - key: MONGODB_URI
        sync: false           # You will paste the MongoDB Atlas URI in the Render dashboard
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value

  # ─── Frontend Static Site (Vite / React) ───────────────────────────────────
  - type: web
    name: tvk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: tvk-backend
          type: web
          property: host        # Render auto-links the backend URL here
