<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamilaga Vettri Kazhagam | TVK Official Portal</title>
    <meta name="description" content="Official digital portal of Tamilaga Vettri Kazhagam. People-first governance, modern digital services, and transparent administration." />

    <!-- Preconnect for fast translation asset loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://translate.googleapis.com">
    <link rel="preconnect" href="https://translate.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;600;700&family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      /* ── Hide Google Translate default banners, tooltips and UI ── */
      .goog-te-banner-frame,
      .goog-te-balloon-frame,
      .goog-te-menu-frame,
      #goog-gt-tt,
      .goog-te-balloon,
      .VIpgJd-yAWNEb-L7lbkb,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf {
        display: none !important;
        visibility: hidden !important;
      }
      .goog-logo-link,
      .goog-te-gadget span {
        display: none !important;
      }
      .goog-te-gadget {
        font-size: 0 !important;
      }
      #google_translate_element {
        display: none !important;
      }
      .skiptranslate {
        display: none !important;
      }
      body {
        top: 0 !important;
        min-height: 100vh;
      }
      /* Remove blue highlight underline added by Google */
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }

      /* ── Clean Tamil Layout Adaptations ── */
      .translated-ltr *,
      .translated-ltr p,
      .translated-ltr span,
      .translated-ltr h1,
      .translated-ltr h2,
      .translated-ltr h3,
      .translated-ltr h4,
      .translated-ltr h5 {
        word-break: break-word;
        overflow-wrap: break-word;
      }

      /* Grid elements min-width 0 so they respect column boundaries */
      .translated-ltr [class*="grid"] > * {
        min-width: 0;
      }

      /* Navigation & Header: keep horizontally locked */
      .translated-ltr header,
      .translated-ltr header nav,
      .translated-ltr header .flex {
        flex-wrap: nowrap !important;
      }

      /* Hide show-original hover tooltips from Google */
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans antialiased selection:bg-tvk-red selection:text-white">

    <!-- Hidden Google Translate widget mount point -->
    <div id="google_translate_element"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Google Translate initialization script -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,ta',
            autoDisplay: false,
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
          },
          'google_translate_element'
        );
      }
    </script>
    <script async defer
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>
  </body>
</html>
